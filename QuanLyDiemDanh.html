<!DOCTYPE html>
<html><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Điểm danh học sinh</title>
<?!= include('AppStyles'); ?>
<style>
  .attendance-toolbar{display:grid;grid-template-columns:180px 160px 180px minmax(240px,1fr) auto;gap:14px;align-items:end;margin-bottom:18px}
  .attendance-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.attendance-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
  .attendance-stat{border:1px solid #dbeafe;border-radius:16px;padding:14px;background:#fff}.attendance-stat span{display:block;color:#64748b;font-size:12px;font-weight:700}.attendance-stat strong{display:block;margin-top:6px;font-size:22px;color:#0f172a}
  .attendance-table{min-width:1050px}.attendance-table select{min-width:175px;font-weight:800}.attendance-table textarea{min-width:230px;min-height:42px;resize:vertical;padding:9px 11px}
  .attendance-student{font-weight:800;color:#0f172a}.attendance-meta{font-size:12px;color:#64748b;margin-top:4px}.attendance-select.status-present{color:#047857;background:#ecfdf5}.attendance-select.status-late{color:#a16207;background:#fefce8}.attendance-select.status-excused{color:#0369a1;background:#eff6ff}.attendance-select.status-absent{color:#b91c1c;background:#fef2f2}.attendance-select.status-empty{color:#64748b;background:#f8fafc}
  .save-attendance-bar{position:sticky;bottom:12px;display:flex;justify-content:flex-end;margin-top:16px;pointer-events:none}.save-attendance-bar button{pointer-events:auto;box-shadow:0 12px 30px rgba(2,132,199,.3)}
  @media(max-width:1000px){.attendance-toolbar{grid-template-columns:1fr 1fr}.attendance-summary{grid-template-columns:1fr 1fr}.attendance-toolbar .search-field{grid-column:1/-1}}
</style><?!= include('AppTheme'); ?></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brand-logo"><? if (brandLogoUrl) { ?><img src="<?= brandLogoUrl ?>" alt="Logo"><? } else { ?>TA<? } ?></div><div class="brand-title"><?= brandName ?> - <?= brandTagline ?></div></div><div class="session-box"><span class="session-label">Kỳ học:</span><strong><?= tenKyHoc ?></strong><select class="header-action-select" onchange="handleHeaderAction(this)"><option value="">Tuỳ chọn</option><option value="CLEAR_CACHE">Làm mới dữ liệu</option><option value="LOGOUT">Đăng xuất</option></select></div></header>
<nav class="ribbon">
  <button class="ribbon-button" onclick="goPage('Index')"><span>🏠</span><span>Trang chính</span></button>
  <button class="ribbon-button" onclick="goPage('QuanLyHocSinh')"><span>👨‍🎓</span><span>Quản lý học sinh</span></button>
  <button class="ribbon-button active" onclick="goPage('QuanLyDiemDanh')"><span>✅</span><span>Điểm danh</span></button>
  <button class="ribbon-button" onclick="goPage('QuanLyThuPhu')"><span>💰</span><span>Quản lý thu phí</span></button>
  <button class="ribbon-button" onclick="goPage('QuanLyThuChi')"><span>💼</span><span>Quản lý thu chi</span></button>
</nav>
<main class="main"><section class="page-card"><div class="page-header"><div><div class="page-title">Điểm danh học sinh</div><div class="page-subtitle">Theo dõi tình trạng có mặt, đi muộn và vắng học theo từng ngày.</div></div></div><div class="content">
  <div class="attendance-toolbar">
    <div class="field"><label>Ngày điểm danh</label><input id="attendanceDate" type="date" onchange="loadAttendance()"></div>
    <div class="field"><label>Khối</label><select id="filterGrade" onchange="renderClassOptions();renderAttendance()"><option value="ALL">Tất cả khối</option></select></div>
    <div class="field"><label>Lớp</label><select id="filterClass" onchange="renderAttendance()"><option value="ALL">Tất cả lớp</option></select></div>
    <div class="field search-field"><label>Tìm kiếm học sinh</label><input id="filterAttendanceKeyword" type="text" placeholder="Nhập tên hoặc số điện thoại..."></div>
    <button class="secondary-button" onclick="loadAttendance()">Tải dữ liệu</button>
  </div>
  <div class="attendance-actions"><button class="primary-button" onclick="markVisible('CO_MAT')">✓ Tất cả có mặt</button><button class="secondary-button" onclick="markVisible('VANG_CO_PHEP')">Vắng có phép</button><button class="secondary-button" onclick="markVisible('CHUA_DIEM_DANH')">Bỏ chọn danh sách lọc</button></div>
  <div class="attendance-summary"><div class="attendance-stat"><span>Tổng học sinh</span><strong id="statAttendanceTotal">0</strong></div><div class="attendance-stat"><span>Có mặt</span><strong id="statAttendancePresent">0</strong></div><div class="attendance-stat"><span>Đi muộn</span><strong id="statAttendanceLate">0</strong></div><div class="attendance-stat"><span>Vắng có phép</span><strong id="statAttendanceExcused">0</strong></div><div class="attendance-stat"><span>Vắng không phép</span><strong id="statAttendanceAbsent">0</strong></div></div>
  <div class="table-wrap"><table class="attendance-table"><thead><tr><th>STT</th><th>Học sinh</th><th>Khối</th><th>Lớp</th><th>Trường</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody id="attendanceTableBody"><tr><td colspan="7"><div class="empty-box">Đang tải dữ liệu...</div></td></tr></tbody></table></div>
  <div class="save-attendance-bar"><button id="btnSaveAttendance" class="save-button" onclick="saveAttendance()">💾 Lưu điểm danh</button></div>
</div></section></main></div>
<script>window.APP_NOTIFICATION_DURATION_MS=<?!= JSON.stringify(notificationDurationMs) ?>;</script><?!= include('AppNotification'); ?><?!= include('AppBusy'); ?>
<script>
const APP_TOKEN=<?!= JSON.stringify(token) ?>,APP_URL=<?!= JSON.stringify(appUrl) ?>;let attendanceStudents=[],gradeList=[],classList=[],visibleAttendance=[];
document.addEventListener('DOMContentLoaded',function(){document.getElementById('attendanceDate').value=todayInput();document.getElementById('filterAttendanceKeyword').addEventListener('input',renderAttendance);loadAttendance()});
function goPage(page){window.top.location.href=APP_URL+'?page='+encodeURIComponent(page)+'&token='+encodeURIComponent(APP_TOKEN)}
function handleHeaderAction(select){const action=select.value;select.value='';if(action==='LOGOUT'){google.script.run.withSuccessHandler(()=>window.top.location.href=APP_URL+'?page=Login').logout(APP_TOKEN)}else if(action==='CLEAR_CACHE'){showBusy('Đang làm mới dữ liệu...');google.script.run.withSuccessHandler(()=>window.top.location.reload()).withFailureHandler(e=>{hideBusy();showNotification(errorText(e),'error')}).clearCacheAndReload(APP_TOKEN)}}
function todayInput(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+day}
function loadAttendance(){const date=document.getElementById('attendanceDate').value;if(!date)return;showBusy('Đang tải danh sách điểm danh...');google.script.run.withSuccessHandler(res=>{hideBusy();const data=JSON.parse(res||'{}');attendanceStudents=data.students||[];gradeList=data.khoiList||[];classList=data.lopList||[];renderGradeOptions();renderClassOptions();renderAttendance()}).withFailureHandler(e=>{hideBusy();showNotification(errorText(e),'error')}).getDiemDanhData(APP_TOKEN,date)}
function renderGradeOptions(){const select=document.getElementById('filterGrade'),current=select.value;select.innerHTML='<option value="ALL">Tất cả khối</option>'+gradeList.map(x=>'<option value="'+attr(x.khoi)+'">'+esc(x.tenKhoi||x.khoi)+'</option>').join('');if(Array.from(select.options).some(x=>x.value===current))select.value=current}
function renderClassOptions(){const grade=document.getElementById('filterGrade').value,select=document.getElementById('filterClass'),current=select.value;select.innerHTML='<option value="ALL">Tất cả lớp</option>'+classList.filter(x=>grade==='ALL'||x.khoi===grade).map(x=>'<option value="'+attr(x.maLop)+'">'+esc(x.tenLop||x.maLop)+'</option>').join('');select.value=Array.from(select.options).some(x=>x.value===current)?current:'ALL'}
function getVisible(){const grade=document.getElementById('filterGrade').value,cls=document.getElementById('filterClass').value,key=normalize(document.getElementById('filterAttendanceKeyword').value);return attendanceStudents.filter(x=>(grade==='ALL'||x.khoi===grade)&&(cls==='ALL'||x.lop===cls)&&(!key||normalize(x.hoTen+' '+x.sdtPhuHuynh).includes(key)))}
function renderAttendance(){visibleAttendance=getVisible();const body=document.getElementById('attendanceTableBody');body.innerHTML=visibleAttendance.length?visibleAttendance.map((x,i)=>'<tr><td>'+(i+1)+'</td><td><div class="attendance-student">'+esc(x.hoTen)+'</div><div class="attendance-meta">'+esc(x.sdtPhuHuynh||'')+'</div></td><td>'+esc(x.khoi)+'</td><td><span class="class-badge">'+esc(className(x.lop))+'</span></td><td>'+esc(x.truong||'')+'</td><td><select class="attendance-select '+statusClass(x.trangThaiDiemDanh)+'" onchange="changeStatus(\''+attr(x.maHocSinh)+'\',this)"><option value="CHUA_DIEM_DANH"'+selected(x,'CHUA_DIEM_DANH')+'>Chưa điểm danh</option><option value="CO_MAT"'+selected(x,'CO_MAT')+'>Có mặt</option><option value="DI_MUON"'+selected(x,'DI_MUON')+'>Đi muộn</option><option value="VANG_CO_PHEP"'+selected(x,'VANG_CO_PHEP')+'>Vắng có phép</option><option value="VANG_KHONG_PHEP"'+selected(x,'VANG_KHONG_PHEP')+'>Vắng không phép</option></select></td><td><textarea placeholder="Ghi chú..." oninput="changeNote(\''+attr(x.maHocSinh)+'\',this.value)">'+esc(x.ghiChuDiemDanh||'')+'</textarea></td></tr>').join(''):'<tr><td colspan="7"><div class="empty-box">Không có học sinh phù hợp.</div></td></tr>';renderStats()}
function selected(x,status){return x.trangThaiDiemDanh===status?' selected':''}function className(code){const x=classList.find(i=>i.maLop===code);return x?x.tenLop:code}function findStudent(id){return attendanceStudents.find(x=>x.maHocSinh===id)}
function changeStatus(id,select){const x=findStudent(id);if(x)x.trangThaiDiemDanh=select.value;select.className='attendance-select '+statusClass(select.value);renderStats()}function changeNote(id,value){const x=findStudent(id);if(x)x.ghiChuDiemDanh=value}
function markVisible(status){getVisible().forEach(x=>x.trangThaiDiemDanh=status);renderAttendance()}
function renderStats(){const list=getVisible(),count=s=>list.filter(x=>x.trangThaiDiemDanh===s).length;text('statAttendanceTotal',list.length);text('statAttendancePresent',count('CO_MAT'));text('statAttendanceLate',count('DI_MUON'));text('statAttendanceExcused',count('VANG_CO_PHEP'));text('statAttendanceAbsent',count('VANG_KHONG_PHEP'))}
function saveAttendance(){const records=attendanceStudents.map(x=>({maHocSinh:x.maHocSinh,trangThai:x.trangThaiDiemDanh||'CHUA_DIEM_DANH',ghiChu:x.ghiChuDiemDanh||''}));if(!records.length){showNotification('Không có học sinh để lưu điểm danh.','warning');return}showBusy('Đang lưu điểm danh...');document.getElementById('btnSaveAttendance').disabled=true;google.script.run.withSuccessHandler(res=>{hideBusy();document.getElementById('btnSaveAttendance').disabled=false;const data=JSON.parse(res||'{}');showNotification(data.message||'Đã lưu điểm danh.','success');loadAttendance()}).withFailureHandler(e=>{hideBusy();document.getElementById('btnSaveAttendance').disabled=false;showNotification(errorText(e),'error')}).saveDiemDanh(APP_TOKEN,document.getElementById('attendanceDate').value,records)}
function statusClass(s){return s==='CO_MAT'?'status-present':s==='DI_MUON'?'status-late':s==='VANG_CO_PHEP'?'status-excused':s==='VANG_KHONG_PHEP'?'status-absent':'status-empty'}function text(id,value){document.getElementById(id).textContent=value}function normalize(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}function errorText(e){return e&&e.message?e.message:String(e||'Có lỗi xảy ra.')}function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function attr(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script></body></html>
