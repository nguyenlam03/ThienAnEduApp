<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('AppStyles'); ?>
  <?!= include('AppTheme'); ?>
  <style>
    .scope-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
    .scope-heading h1{font-size:24px;margin:0 0 8px;color:#12345b}
    .scope-heading p{margin:0;color:#64748b;line-height:1.6}
    .term-panel{background:white;border:1px solid #d8e3ef;border-radius:18px;margin-bottom:24px;overflow:hidden}
    .term-heading{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f5f8fc;border-bottom:1px solid #d8e3ef}
    .term-heading h2{font-size:17px;margin:0;color:#12345b}
    .term-heading a{font-size:13px;color:#0369a1;font-weight:700;text-decoration:none}
    .term-panel iframe{display:block;width:100%;height:760px;border:0;background:white}
    .scope-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .scope-links a{padding:8px 12px;border-radius:10px;background:white;border:1px solid #d8e3ef;color:#12345b;text-decoration:none;font-size:13px}
    @media(max-width:720px){.term-heading{align-items:flex-start;flex-direction:column}.term-panel iframe{height:680px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand-title"><?= brandName ?></div><div class="session-box">Tất cả kỳ học <button class="secondary-button" onclick="signOut()">Đăng xuất</button></div></header>
    <?!= include('AppNavigation'); ?>
    <main class="main">
      <div class="scope-heading"><div><h1>Tất cả kỳ học</h1><p>Xem và thao tác theo từng kỳ học. Các bộ lọc ngày, tháng nằm trong từng nhóm.</p></div></div>
      <? if (!terms.length) { ?><p>Chưa có dữ liệu kỳ học.</p><? } ?>
      <div class="scope-links"><? terms.forEach(function(term, index) { ?><a href="#term-<?= index ?>" target="_self"><?= term.tenKyHoc ?></a><? }); ?></div>
      <? terms.forEach(function(term, index) { ?>
      <section class="term-panel" id="term-<?= index ?>">
        <div class="term-heading"><h2><?= term.tenKyHoc ?></h2><a href="<?= term.url.replace('&embedded=1', '') ?>">Mở riêng kỳ học ↗</a></div>
        <iframe src="<?= term.url ?>" title="<?= term.tenKyHoc ?>" referrerpolicy="no-referrer"></iframe>
      </section>
      <? }); ?>
    </main>
  </div>
  <script>
    window.APP_CURRENT_PAGE = <?!= inlineScriptJson_(page) ?>;
    const APP_URL = <?!= inlineScriptJson_(appUrl) ?>;
    const APP_TOKEN = <?!= inlineScriptJson_(token) ?>;
    function goPage(page) { window.top.location.href = APP_URL + '?page=' + encodeURIComponent(page) + '&token=' + encodeURIComponent(APP_TOKEN); }
    function signOut() {
      google.script.run.withSuccessHandler(function () { window.top.location.href = APP_URL; })
        .withFailureHandler(function () { alert('Không thể đăng xuất. Vui lòng thử lại.'); }).logout(APP_TOKEN);
    }
  </script>
</body>
</html>
