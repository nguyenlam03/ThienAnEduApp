<script>
(function () {
  function closeNavigationGroups(except) {
    document.querySelectorAll('.app-navigation .nav-group.open').forEach(function (group) {
      if (group === except) return;
      group.classList.remove('open');
      var toggle = group.querySelector('.nav-group-toggle');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function initializeAppNavigation() {
    var navigation = document.querySelector('.app-navigation');
    if (!navigation) return;
    var currentPage = String(window.APP_CURRENT_PAGE || 'Index');
    var currentItem = navigation.querySelector('[data-page="' + currentPage + '"]');
    if (currentItem) currentItem.classList.add('active');
    navigation.querySelectorAll('.nav-group').forEach(function (group) {
      var pages = String(group.getAttribute('data-pages') || '').split(/\s+/);
      if (pages.indexOf(currentPage) !== -1) group.querySelector('.nav-group-toggle').classList.add('active');
      var toggle = group.querySelector('.nav-group-toggle');
      toggle.addEventListener('click', function (event) {
        event.stopPropagation();
        var willOpen = !group.classList.contains('open');
        closeNavigationGroups(group);
        if (willOpen && window.matchMedia('(max-width: 720px)').matches) {
          group.querySelector('.nav-dropdown').style.top = (toggle.getBoundingClientRect().bottom + 8) + 'px';
        }
        group.classList.toggle('open', willOpen);
        toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });
    });
    document.addEventListener('click', function (event) {
      if (!event.target.closest('.app-navigation')) closeNavigationGroups();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeNavigationGroups();
    });
  }

  document.addEventListener('DOMContentLoaded', initializeAppNavigation);
})();
</script>
